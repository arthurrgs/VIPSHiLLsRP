<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>VIP Diamante • HiLLs RP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #050505;
      color: #faf6f6;
      min-height: 100vh;
    }

    /* ================= HEADER ================= */

    header {
      padding: 80px 20px 70px;
      text-align: center;
      background: linear-gradient(135deg, #04e1e9, #080808, #04e1e9);
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 3px;
      background: rgba(255,255,255,0.45);
      border-radius: 5px;
    }

    header h1 {
      font-size: 3em;
      letter-spacing: 3px;
      color: #7df5ff;
    }

    header p {
      margin-top: 15px;
      font-size: 1.1em;
      color: rgba(255,255,255,0.9);
    }

    /* ================= CONTENT ================= */

    .vip-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 70px 20px;
      gap: 35px;
      background: rgba(10, 10, 20, 0.96);
      min-height: 100vh;
    }

    /* Imagens */
    .vip-content img {
      width: 280px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(4,225,233,0.45);
      transition: transform 0.3s ease;
    }

    .vip-content img:hover {
      transform: scale(1.06);
    }

    .vip-content img + img {
      margin-top: -12px;
    }

    .vip-info {
      font-size: 1.15em;
      text-align: center;
      max-width: 580px;
      line-height: 1.6;
    }

    .vip-info strong {
      color: #7df5ff;
    }

    /* ================= PRICE ================= */

    .vip-price {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      padding: 26px 34px;
      font-size: 1.1em;
      text-align: center;
      box-shadow: 0 0 30px rgba(4,225,233,0.4);
    }

    .vip-price span {
      display: block;
      font-size: 0.9em;
      color: rgba(255,255,255,0.85);
    }

    .vip-price strong {
      display: block;
      color: #7df5ff;
      font-size: 1.55em;
      margin-top: 6px;
    }

    /* ================= BUTTONS ================= */

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 14px 36px;
      font-size: 1.05em;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      color: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
    }

    .btn-buy {
      background: linear-gradient(135deg, #28a745, #1e7e34);
      box-shadow: 0 6px 18px rgba(0,255,120,0.35);
    }

    .btn-buy:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 26px rgba(0,255,140,0.6);
    }

    .btn-back {
      background: linear-gradient(135deg, #555, #222);
      box-shadow: 0 5px 15px rgba(0,0,0,0.6);
    }

    .btn-back:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #666, #111);
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header>
    <h1>VIP DIAMANTE</h1>
    <p>O pacote mais exclusivo do HiLLs RP</p>
  </header>

  <!-- ================= CONTENT ================= -->
  <div class="vip-content">
    <img src="mercedes.png" alt="VIP Diamante - Mercedes">
    <img src="r34.png" alt="VIP Diamante - R34">
    <img src="kuruma.png" alt="VIP Diamante - Kuruma">
    <img src="cbr.png" alt="VIP Diamante - CBR">
    <img src="s1000.png" alt="VIP Diamante - S1000">
    <img src="xj6.png" alt="VIP Diamante - xj6">
    <img src="tinker.png" alt="VIP Esmeralda - tinker">
    <img src="asa.png" alt="VIP Esmeralda - asa">
    <img src="branca.png" alt="VIP Platina - branca">
    <img src="preto.png" alt="VIP Platina - preto">
    <img src="ponei.png" alt="VIP Platina - branca">
    <img src="menor.png" alt="VIP Platina - preto">

    <div class="vip-info">
      <p><strong>Veículos:</strong> Mercedes, Kuruma blindado, R34, CBR, s1000, e xj6</p>
      <p><strong>Benefícios mensal:</strong> Pistola + AK-47 + Colete + R$ 685.000 💸</p>
      <p>✔ Cargo exclusivo no Discord 🔵🔫</p>
    </div>

    <div class="vip-price">
      <span>Plano Mensal</span>
      <strong>R$ 34,99</strong>
    </div>

    <div class="buttons">
      <button class="btn btn-buy"
        onclick="window.open('https://discord.com/channels/1441911366251450511/1449457664307232911','_blank')">
        Comprar VIP
      </button>

      <button class="btn btn-back" onclick="window.location.href='index.html'">
        Voltar
      </button>
    </div>
  </div>

</body>
</html>
