<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>VIP Ouro • HiLLs RP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
    }

    /* ================= HEADER ================= */

    header {
      padding: 80px 20px 70px;
      text-align: center;
      background: linear-gradient(135deg, #f0c403, #080808, #f0c403);
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 3px;
      background: rgba(255,255,255,0.35);
      border-radius: 5px;
    }

    header h1 {
      font-size: 3em;
      letter-spacing: 3px;
      color: #ffd43b;
    }

    header p {
      margin-top: 15px;
      font-size: 1.1em;
      color: rgba(255,255,255,0.9);
    }

    /* ================= CONTENT ================= */

    .vip-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 70px 20px;
      gap: 35px;
      background: rgba(10, 10, 20, 0.96);
      min-height: 100vh;
    }

    .vip-content img {
      width: 300px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(240,196,3,0.45);
      transition: transform 0.3s ease;
    }

    .vip-content img:hover {
      transform: scale(1.05);
    }

    .vip-info {
      font-size: 1.15em;
      text-align: center;
      max-width: 520px;
      line-height: 1.6;
    }

    .vip-info strong {
      color: #ffd43b;
    }

    /* ================= PRICE CARD ================= */

    .vip-price {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 25px 30px;
      font-size: 1.1em;
      text-align: center;
      box-shadow: 0 0 22px rgba(240,196,3,0.3);
    }

    .vip-price span {
      display: block;
      font-size: 0.9em;
      color: rgba(255,255,255,0.8);
    }

    .vip-price strong {
      display: block;
      color: #ffd43b;
      font-size: 1.5em;
      margin-top: 6px;
    }

    /* ================= BUTTONS ================= */

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 14px 36px;
      font-size: 1.05em;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      color: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
    }

    .btn-buy {
      background: linear-gradient(135deg, #28a745, #1e7e34);
      box-shadow: 0 6px 18px rgba(0,255,100,0.35);
    }

    .btn-buy:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 26px rgba(0,255,120,0.6);
    }

    .btn-back {
      background: linear-gradient(135deg, #555, #222);
      box-shadow: 0 5px 15px rgba(0,0,0,0.6);
    }

    .btn-back:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #666, #111);
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header>
    <h1>VIP OURO</h1>
    <p>Equilíbrio perfeito entre custo e poder dentro do HiLLs RP</p>
  </header>

  <!-- ================= CONTENT ================= -->
  <div class="vip-content">
    <img src="corsa.png" alt="VIP Ouro - Corsa">
    <img src="loira.png" alt="VIP Ouro - loira">
    <img src="azul.png" alt="VIP Ouro - loira">

    <div class="vip-info">
      <p><strong>Veículo:</strong> Corsa</p>
      <p><strong>Benefícios mensal:</strong> Pistola + AK-47 + R$ 385.000 💸 Escolha apenas uma skin!</p>
      <p>✔ Cargo exclusivo no Discord 🟡🔫</p>
    </div>

    <div class="vip-price">
      <span>Plano Mensal</span>
      <strong>R$ 14,99</strong>
    </div>

    <div class="buttons">
      <button class="btn btn-buy"
        onclick="window.open('https://discord.com/channels/1441911366251450511/1449457338401554576','_blank')">
        Comprar VIP
      </button>

      <button class="btn btn-back" onclick="window.location.href='index.html'">
        Voltar
      </button>
    </div>
  </div>

</body>
</html>
