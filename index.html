<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>VIPS BETA HiLLs RP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: rgb(5, 5, 5);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ================= HERO / BANNER ================= */

    header.hero {
      padding: 90px 20px 80px;
      text-align: center;
      background: linear-gradient(135deg, #0105f7, #da0488, #ff0037);
      box-shadow: 0 20px 40px rgba(0,0,0,0.85);
      position: relative;
    }

    header.hero::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 3px;
      background: rgba(255,255,255,0.4);
      border-radius: 5px;
    }

    .hero h1 {
      font-size: 3em;
      letter-spacing: 2px;
    }

    .title-part {
      display: inline-block;
    }

    .vips-white { color: white; }
    .betahills-yellow { color: #e6d300; }

    .rp-highlight .r { color: #00ff00; }
    .rp-highlight .p { color: #0033cc; }

    .hero-subtitle {
      margin-top: 18px;
      font-size: 1.15em;
      color: rgba(255,255,255,0.95);
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-hint {
      display: inline-block;
      margin-top: 30px;
      font-size: 0.9em;
      color: rgba(255,255,255,0.7);
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(6px); }
      100% { transform: translateY(0); }
    }

    /* ================= VIP SECTION ================= */

    .vips-section {
      position: relative;
    }

    canvas#particles-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .vips-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 70px 20px;
      position: relative;
      z-index: 1;
      background: rgba(10,10,20,0.95);
    }

    .vip-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 15px;
      width: 210px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .vip-card:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 0 25px rgba(255,255,255,0.35);
    }

    .vip-card img {
      width: 100%;
      border-radius: 12px;
    }

    .vip-name {
      margin-top: 12px;
      font-size: 1.2em;
      font-weight: bold;
    }

    /* ================= FOOTER ================= */

    footer.footer {
      background-color: #0a0a0a;
      padding: 45px 20px 30px;
      text-align: center;
      color: #ccc;
    }

    .support-button {
      background-color: #28a745;
      color: white;
      padding: 13px 32px;
      font-size: 1.1em;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      box-shadow: 0 6px 15px rgba(0,255,100,0.25);
    }

    .support-button:hover {
      background-color: #218838;
      transform: scale(1.05);
    }

    .footer-desc {
      margin-top: 15px;
      font-size: 0.95em;
      color: #aaa;
    }

    .footer-rights {
      margin-top: 10px;
      font-size: 0.85em;
      color: #666;
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="hero">
    <h1>
      <span class="title-part vips-white">VIPS</span>
      <span class="title-part betahills-yellow"> BETA HiLLs</span>
      <span class="title-part rp-highlight">
        <span class="r">R</span><span class="p">P</span>
      </span>
    </h1>

    <p class="hero-subtitle">
      Apoie o servidor e desbloqueie vantagens exclusivas dentro do HiLLs RP
    </p>

    <span class="hero-hint">Escolha seu VIP abaixo ↓</span>
  </header>

  <!-- ================= VIPS ================= -->
  <section class="vips-section">
    <canvas id="particles-bg"></canvas>

    <div class="vips-container">
      <div class="vip-card" onclick="location.href='bronze.html'">
        <img src="VIPBRONZE.png" alt="VIP Bronze">
        <div class="vip-name">VIP Bronze</div>
      </div>

      <div class="vip-card" onclick="location.href='ouro.html'">
        <img src="VIPOURO.png" alt="VIP Ouro">
        <div class="vip-name">VIP Ouro</div>
      </div>

      <div class="vip-card" onclick="location.href='platina.html'">
        <img src="VIPPLATINA.png" alt="VIP Platina">
        <div class="vip-name">VIP Platina</div>
      </div>

      <div class="vip-card" onclick="location.href='esmeralda.html'">
        <img src="VIPESMERALDA.png" alt="VIP Esmeralda">
        <div class="vip-name">VIP Esmeralda</div>
      </div>

      <div class="vip-card" onclick="location.href='diamante.html'">
        <img src="VIPDIAMANTE.png" alt="VIP Diamante">
        <div class="vip-name">VIP Diamante</div>
      </div>
    </div>
  </section>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    <button class="support-button"
      onclick="window.open('https://discord.com/channels/1441911366251450511/1449230583690690750','_blank')">
      Suporte
    </button>

    <p class="footer-desc">
      Entre em contato com nossa equipe através do Discord.
    </p>

    <p class="footer-rights">
      © HiLLs RP — Todos os Direitos Reservados
    </p>
  </footer>

  <!-- ================= PARTICLES ================= -->
  <script>
    const canvas = document.getElementById('particles-bg');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    const colors = ["#ff0055", "#0066ff", "#00ffaa", "#ffffff"];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = document.querySelector('.vips-section').offsetHeight;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particlesArray = [];
      for (let i = 0; i < 80; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particlesArray.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
    });

    resizeCanvas();
    initParticles();
    animateParticles();
  </script>

</body>
</html>
